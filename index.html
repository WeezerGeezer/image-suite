<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Border Image Tool</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>White Border Image Tool</h1>
        <div class="upload-section">
            <label for="imageInput" class="upload-button">
                Choose Image
                <input type="file" id="imageInput" accept="image/*">
            </label>

            <div class="mode-selector">
                <label>
                    <input type="radio" name="mode" value="scale" checked>
                    Scale Mode (original behavior - fit image with borders)
                </label>
                <label>
                    <input type="radio" name="mode" value="crop">
                    Crop Mode (crop to aspect ratio, position with white bar)
                </label>
            </div>

            <div class="preset-section">
                <label for="presetSize">Quick Presets:</label>
                <select id="presetSize">
                    <option value="">Custom</option>
                    <option value="4x6">4x6 inches</option>
                    <option value="4x4">4x4 inches (square)</option>
                    <option value="5x7">5x7 inches</option>
                    <option value="3x3">3x3 inches (square)</option>
                    <option value="3x5">3x5 inches</option>
                    <option value="8x10">8x10 inches</option>
                    <option value="6x6">6x6 inches (square)</option>
                </select>
            </div>

            <div class="size-inputs">
                <div class="input-group">
                    <label for="targetWidth">Target Width (inches):</label>
                    <input type="number" id="targetWidth" value="8" step="0.1" min="0">
                </div>
                <div class="input-group">
                    <label for="targetHeight">Target Height (inches):</label>
                    <input type="number" id="targetHeight" value="10" step="0.1" min="0">
                </div>
                <div class="input-group">
                    <label for="dpi">DPI:</label>
                    <input type="number" id="dpi" value="300" step="1" min="72">
                </div>
            </div>

            <div id="cropControls" class="crop-controls" style="display: none;">
                <div class="input-group">
                    <label for="sourceAspect">Source Image Aspect:</label>
                    <select id="sourceAspect">
                        <option value="">Use full image</option>
                        <option value="1:1">1:1 (Square)</option>
                        <option value="4:3">4:3</option>
                        <option value="3:2">3:2</option>
                        <option value="16:9">16:9</option>
                        <option value="custom">Custom ratio</option>
                    </select>
                </div>
                <div class="input-group" id="customSourceRatio" style="display: none;">
                    <label for="customSourceWidth">Custom W:H</label>
                    <input type="number" id="customSourceWidth" placeholder="Width" step="0.1" min="0.1">
                    <input type="number" id="customSourceHeight" placeholder="Height" step="0.1" min="0.1">
                </div>
                <div class="input-group">
                    <label for="alignment">White Bar Position:</label>
                    <select id="alignment">
                        <option value="center">Center (bars on both sides if needed)</option>
                        <option value="left">Left (white bar on right)</option>
                        <option value="right">Right (white bar on left)</option>
                        <option value="top">Top (white bar on bottom)</option>
                        <option value="bottom">Bottom (white bar on top)</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="preview-section">
            <div class="image-preview">
                <canvas id="previewCanvas"></canvas>
            </div>
            <button id="downloadBtn" disabled>Download Image</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
