<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Border Image Tool</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>White Border Image Tool</h1>

        <div class="setup-section" id="setupSection">
            <h2>Step 1: Configure Output Size</h2>

            <div class="controls-section">
                <div class="control-group">
                    <label for="presetSize">Print Size (Outer Frame):</label>
                    <select id="presetSize">
                        <option value="4x6">4x6 inches</option>
                        <option value="4x4">4x4 inches (square)</option>
                        <option value="5x7">5x7 inches</option>
                        <option value="3x3">3x3 inches (square)</option>
                        <option value="3x5">3x5 inches</option>
                        <option value="8x10">8x10 inches</option>
                        <option value="6x6">6x6 inches (square)</option>
                        <option value="custom">Custom Size</option>
                    </select>
                </div>

                <div class="custom-size-inputs" id="customSizeInputs" style="display: none;">
                    <div class="control-group">
                        <label for="targetWidth">Print Width (inches):</label>
                        <input type="number" id="targetWidth" value="4" step="0.1" min="0.1">
                    </div>
                    <div class="control-group">
                        <label for="targetHeight">Print Height (inches):</label>
                        <input type="number" id="targetHeight" value="6" step="0.1" min="0.1">
                    </div>
                </div>

                <div class="control-group">
                    <label for="innerPreset">Image Size (Inner Frame):</label>
                    <select id="innerPreset">
                        <option value="same">Same as Print Size</option>
                        <option value="4x6">4x6 inches</option>
                        <option value="4x4">4x4 inches (square)</option>
                        <option value="5x7">5x7 inches</option>
                        <option value="3x3">3x3 inches (square)</option>
                        <option value="3x5">3x5 inches</option>
                        <option value="8x10">8x10 inches</option>
                        <option value="6x6">6x6 inches (square)</option>
                        <option value="custom">Custom Size</option>
                    </select>
                </div>

                <div class="custom-size-inputs" id="customInnerInputs" style="display: none;">
                    <div class="control-group">
                        <label for="innerWidth">Image Width (inches):</label>
                        <input type="number" id="innerWidth" value="4" step="0.1" min="0.1">
                    </div>
                    <div class="control-group">
                        <label for="innerHeight">Image Height (inches):</label>
                        <input type="number" id="innerHeight" value="4" step="0.1" min="0.1">
                    </div>
                </div>

                <div class="control-group">
                    <label for="dpi">Print Quality (DPI):</label>
                    <select id="dpi">
                        <option value="150">150 - Screen/Web</option>
                        <option value="300" selected>300 - Standard Print</option>
                        <option value="600">600 - High Quality</option>
                    </select>
                </div>
            </div>

            <button id="continueBtn" class="continue-btn">Continue to Image Upload</button>
        </div>

        <div class="upload-section" id="uploadSection" style="display: none;">
            <h2>Step 2: Choose Your Image</h2>
            <label for="imageInput" class="upload-button">
                Choose Image
                <input type="file" id="imageInput" accept="image/*">
            </label>
            <button id="backBtn" class="back-btn">← Back to Settings</button>
        </div>

        <div class="editor-section" id="editorSection" style="display: none;">
            <div class="editor-header">
                <h2>Step 3: Position Your Image</h2>
                <p>Drag to move • Scroll to zoom • Green box = image area • White areas = borders</p>
            </div>

            <div class="editor-workspace">
                <div class="canvas-container">
                    <canvas id="editorCanvas"></canvas>
                </div>

                <div class="editor-controls">
                    <div class="control-group">
                        <label for="scaleSlider">Zoom: <span id="scaleValue">100%</span></label>
                        <input type="range" id="scaleSlider" min="10" max="200" value="100" step="1">
                    </div>

                    <div class="button-group">
                        <button id="fitBtn" class="control-btn">Fit to Canvas</button>
                        <button id="fillBtn" class="control-btn">Fill Canvas</button>
                        <button id="centerBtn" class="control-btn">Center</button>
                        <button id="resetBtn" class="control-btn">Reset</button>
                    </div>
                </div>
            </div>

            <div class="output-preview">
                <h3>Final Output Preview</h3>
                <div class="preview-container">
                    <canvas id="previewCanvas"></canvas>
                </div>
                <button id="downloadBtn" class="download-btn">Download Image</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
